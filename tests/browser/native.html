<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' https: data:; style-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; font-src 'self' data:; script-src 'self' 'nonce-mm-test-nonce'; connect-src 'none';">
  <script nonce="mm-test-nonce">
    window.__markdownMintCspViolations = [];
    document.addEventListener('securitypolicyviolation', event => {
      window.__markdownMintCspViolations.push({
        directive: event.effectiveDirective,
        blockedURI: event.blockedURI
      });
      document.documentElement.dataset.mmCspViolationCount = String(window.__markdownMintCspViolations.length);
      document.documentElement.dataset.mmCspLastDirective = event.effectiveDirective;
      document.documentElement.setAttribute('data-mm-csp-last-blocked', String(event.blockedURI || 'unknown'));
      document.documentElement.setAttribute('data-mm-csp-last-source', String(event.sourceFile || 'unknown'));
      document.documentElement.setAttribute('data-mm-csp-last-sample', String(event.sample || 'unknown'));
    });
  </script>
  <!-- This is the native preview cascade: VS Code's stylesheet first, then
       the extension's shared preview contribution. -->
  <link rel="stylesheet" href="/__vscode__/markdown.css">
  <link rel="stylesheet" href="/media/document.css">
  <link rel="stylesheet" href="/dist/katex/katex.css">
  <link rel="stylesheet" href="/tests/browser/native-theme.css">
</head>
<body>
  <main class="markdown-body" data-testid="native-content">
    <h1>Browser harness</h1>
    <p>Paragraph with <strong>marks</strong> and a <a href="#">link</a>.</p>
    <ul class="contains-task-list">
      <li class="task-list-item"><input type="checkbox" disabled> <p>Task</p></li>
    </ul>
    <pre><code class="language-ts">const value = &quot;日本語&quot;;</code></pre>
    <table>
      <thead><tr><th>Name</th><th>値</th><th>空欄</th></tr></thead>
      <tbody><tr><td>A</td><td>日本語</td><td></td></tr></tbody>
    </table>
    <!-- markdown-mint-mermaid-fixture -->
    <!-- The server fills this marker for ?fixture=math with the same KaTeX
         wrappers used by the extension's native Markdown renderer. -->
    <!-- markdown-mint-math-fixture -->
  </main>
  <script nonce="mm-test-nonce">
    window.__markdownMintNative = {
      metrics() {
        const content = document.querySelector('[data-testid="native-content"]');
        return {
          viewport: [innerWidth, innerHeight, document.documentElement.clientWidth],
          body: document.body.getBoundingClientRect().toJSON(),
          content: content?.getBoundingClientRect().toJSON(),
          heading: content?.querySelector('h1')?.getBoundingClientRect().toJSON(),
          task: content?.querySelector('li.task-list-item')?.getBoundingClientRect().toJSON(),
          checkbox: content?.querySelector('li.task-list-item input')?.getBoundingClientRect().toJSON(),
          table: content?.querySelector('table')?.getBoundingClientRect().toJSON(),
          cells: Array.from(content?.querySelectorAll('th,td') ?? []).map(cell => cell.getBoundingClientRect().toJSON()),
          math: {
            blocks: content?.querySelectorAll('.mm-math-block').length ?? 0,
            matrices: content?.querySelectorAll('.mm-math-block mtable').length ?? 0,
            inline: content?.querySelectorAll('.mm-math-inline').length ?? 0,
          },
          mermaid: {
            flowcharts: content?.querySelectorAll('svg[aria-roledescription="flowchart-v2"]').length ?? 0,
            nodes: content?.querySelectorAll('svg[aria-roledescription="flowchart-v2"] .node').length ?? 0,
            nodeAnchors: Array.from(content?.querySelectorAll('svg[aria-roledescription="flowchart-v2"] .node .label text') ?? []).map(text => getComputedStyle(text).textAnchor),
            centerDeltas: Array.from(content?.querySelectorAll('svg[aria-roledescription="flowchart-v2"] .node') ?? []).map(node => {
              const shape = node.querySelector('.label-container');
              const text = node.querySelector('.label text');
              if (!shape || !text) return Infinity;
              const shapeBox = shape.getBoundingClientRect();
              const textBox = text.getBoundingClientRect();
              return Math.abs((textBox.left + textBox.width / 2) - (shapeBox.left + shapeBox.width / 2));
            }),
            edgeLabels: Array.from(content?.querySelectorAll('svg[aria-roledescription="flowchart-v2"] .edgeLabel text') ?? []).map(text => ({ text: text.textContent, computed: getComputedStyle(text).textAnchor })),
            sequenceMessages: Array.from(content?.querySelectorAll('svg[aria-roledescription="sequence"] .messageText') ?? []).map(text => getComputedStyle(text).textAnchor),
            sourcePreserved: Array.from(content?.querySelectorAll('.mm-mermaid') ?? []).every(diagram => diagram.dataset.mermaidSource?.includes('flowchart LR') || diagram.dataset.mermaidSource?.includes('sequenceDiagram')),
          },
          font: content ? getComputedStyle(content).fontFamily : '',
          size: content ? getComputedStyle(content).fontSize : '',
          line: content ? getComputedStyle(content).lineHeight : ''
        };
      }
    };
  </script>
  <script nonce="mm-test-nonce" src="/dist/mermaid-loader.js"></script>
</body>
</html>
