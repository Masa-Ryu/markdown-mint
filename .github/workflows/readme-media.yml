name: Capture README media

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install and build the actual extension
        run: |
          npm ci
          npm run build
      - name: Install capture-only tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/mm-capture-tools" --ignore-scripts --no-audit --no-fund --save-exact playwright@1.58.2
          "$RUNNER_TEMP/mm-capture-tools/node_modules/.bin/playwright" install --with-deps chromium
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          curl --fail --location --retry 3 https://raw.githubusercontent.com/microsoft/vscode/1.90.0/extensions/markdown-language-features/media/markdown.css --output "$RUNNER_TEMP/mm-markdown.css"
      - name: Capture real editor interactions
        env:
          MM_CAPTURE_TOOLS: ${{ runner.temp }}/mm-capture-tools
          VSCODE_MARKDOWN_CSS: ${{ runner.temp }}/mm-markdown.css
        run: node scripts/capture-readme.mjs
      - name: Validate
        run: |
          npm run compile
          npm run lint
          npm test
          npm run format:check
      - name: Upload captures and diagnostics for review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: readme-media
          path: |
            images/readme/
            output/readme-capture/
          retention-days: 7
          if-no-files-found: error
