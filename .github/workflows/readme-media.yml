name: Capture README media

on:
  workflow_dispatch:
  push:
    branches: [docs/visual-readme]
    paths:
      - scripts/capture-readme.mjs
      - .github/workflows/readme-media.yml

permissions:
  contents: read

concurrency:
  group: readme-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.ref == 'refs/heads/docs/visual-readme'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install and build the actual extension
        run: |
          npm ci
          npm run build
      - name: Install capture-only tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/mm-capture-tools" --ignore-scripts --no-audit --no-fund --save-exact playwright@1.58.2
          "$RUNNER_TEMP/mm-capture-tools/node_modules/.bin/playwright" install --with-deps chromium
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          curl --fail --location --retry 3 https://raw.githubusercontent.com/microsoft/vscode/1.90.0/extensions/markdown-language-features/media/markdown.css --output "$RUNNER_TEMP/mm-markdown.css"
      - name: Capture real editor interactions
        env:
          MM_CAPTURE_TOOLS: ${{ runner.temp }}/mm-capture-tools
          VSCODE_MARKDOWN_CSS: ${{ runner.temp }}/mm-markdown.css
        run: node scripts/capture-readme.mjs
      - name: Validate
        continue-on-error: true
        run: |
          npm run compile
          npm run lint
          npm test
          npm run format:check
      - name: Commit generated media to this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/readme
          if ! git diff --cached --quiet; then
            git commit -m 'docs: add captured editor screenshots and table demo'
            git push origin HEAD:docs/visual-readme
          fi
      - name: Upload captures and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: readme-media
          path: |
            images/readme/
            output/readme-capture/
          retention-days: 7
          if-no-files-found: warn
