name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markdown-mint-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and package release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      sha256: ${{ steps.artifact.outputs.sha256 }}
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release target and metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases can only be started from main (selected ref: $GITHUB_REF)."
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::Checkout does not match the workflow's selected commit $GITHUB_SHA."
            exit 1
          fi

          version="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; process.stdout.write(JSON.parse(readFileSync("package.json", "utf8")).version)')"
          tag="v${version}"
          node scripts/release-notes.mjs > "$RUNNER_TEMP/release-notes.md"

          api_status() {
            local endpoint="$1"
            local response_file="$2"
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/${endpoint}"
          }

          tag_status="$(api_status "git/ref/tags/${tag}" "$RUNNER_TEMP/tag-response.json")"
          case "$tag_status" in
            200)
              echo "::error::Git tag ${tag} already exists."
              exit 1
              ;;
            404) ;;
            *)
              cat "$RUNNER_TEMP/tag-response.json"
              echo "::error::Could not verify whether Git tag ${tag} exists (HTTP ${tag_status})."
              exit 1
              ;;
          esac

          release_status="$(api_status "releases/tags/${tag}" "$RUNNER_TEMP/release-response.json")"
          case "$release_status" in
            200)
              echo "::error::GitHub Release ${tag} already exists."
              exit 1
              ;;
            404) ;;
            *)
              cat "$RUNNER_TEMP/release-response.json"
              echo "::error::Could not verify whether GitHub Release ${tag} exists (HTTP ${release_status})."
              exit 1
              ;;
          esac

          artifact_name="markdown-mint-${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Package and verify the VSIX
        run: npm run package

      - name: Confirm the single release artifact
        id: artifact
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(markdown-mint-*.vsix)
          expected="markdown-mint-${VERSION}.vsix"
          if [[ ${#packages[@]} -ne 1 || "${packages[0]}" != "$expected" ]]; then
            printf '::error::Expected exactly %s; found: %s\n' "$expected" "${packages[*]:-none}"
            exit 1
          fi

          sha256="$(sha256sum "$expected" | cut -d ' ' -f 1)"
          cp "$RUNNER_TEMP/release-notes.md" release-notes.md
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"
          printf 'Verified release artifact: %s (SHA-256 %s)\n' "$expected" "$sha256"

      - name: Retain the exact release payload for recovery
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            markdown-mint-${{ steps.metadata.outputs.version }}.vsix
            release-notes.md
          if-no-files-found: error
          retention-days: 90

  publish_marketplace:
    name: Publish to VS Code Marketplace
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the same release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the locked VSCE CLI
        run: npm ci

      - name: Download the verified release payload
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validate.outputs.artifact_name }}
          path: release-payload

      - name: Verify the downloaded artifact
        id: payload
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_SHA256: ${{ needs.validate.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          vsix="release-payload/markdown-mint-${VERSION}.vsix"
          notes="release-payload/release-notes.md"
          if [[ ! -f "$vsix" || ! -f "$notes" ]]; then
            echo "::error::The validated VSIX or release notes are missing from the workflow artifact."
            exit 1
          fi

          actual_sha256="$(sha256sum "$vsix" | cut -d ' ' -f 1)"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::The downloaded VSIX checksum does not match the validated artifact."
            exit 1
          fi
          echo "vsix_path=${vsix}" >> "$GITHUB_OUTPUT"
          echo "The downloaded VSIX matches the validated SHA-256 ${actual_sha256}."

      - name: Publish the verified VSIX to the VS Code Marketplace
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ARTIFACT_NAME: ${{ needs.validate.outputs.artifact_name }}
          VSIX_PATH: ${{ steps.payload.outputs.vsix_path }}
        shell: bash
        run: |
          set -euo pipefail
          if ! npx --no-install vsce publish --packagePath "$VSIX_PATH" --oidc; then
            echo "::error::Marketplace publication failed or returned an uncertain result for ${VERSION}. The unchanged VSIX is retained in workflow artifact ${ARTIFACT_NAME} from run ${GITHUB_RUN_ID}; verify Marketplace status before retrying."
            exit 1
          fi

      - name: Record Marketplace publication details
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ARTIFACT_NAME: ${{ needs.validate.outputs.artifact_name }}
          EXPECTED_SHA256: ${{ needs.validate.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          {
            echo "Marketplace publication succeeded for ${tag}."
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Retained payload: ${ARTIFACT_NAME}"
            echo "Target commit: ${GITHUB_SHA}"
            echo "VSIX SHA-256: ${EXPECTED_SHA256}"
            echo "If the GitHub Release job fails, rerun failed jobs for this run to reuse this payload without publishing to the Marketplace again."
          } >> "$GITHUB_STEP_SUMMARY"

  publish_github_release:
    name: Publish GitHub Release
    needs: [validate, publish_marketplace]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the validated release payload
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validate.outputs.artifact_name }}
          path: release-payload

      - name: Verify the downloaded artifact
        id: payload
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_SHA256: ${{ needs.validate.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          vsix="release-payload/markdown-mint-${VERSION}.vsix"
          notes="release-payload/release-notes.md"
          if [[ ! -f "$vsix" || ! -f "$notes" ]]; then
            echo "::error::The validated VSIX or release notes are missing from the workflow artifact."
            exit 1
          fi

          actual_sha256="$(sha256sum "$vsix" | cut -d ' ' -f 1)"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::The downloaded VSIX checksum does not match the validated artifact."
            exit 1
          fi
          echo "vsix_path=${vsix}" >> "$GITHUB_OUTPUT"
          echo "The downloaded VSIX matches the validated SHA-256 ${actual_sha256}."

      - name: Create or recover the GitHub Release with the same VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          ARTIFACT_NAME: ${{ needs.validate.outputs.artifact_name }}
          EXPECTED_SHA256: ${{ needs.validate.outputs.sha256 }}
          VSIX_PATH: ${{ steps.payload.outputs.vsix_path }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          title="Markdown Mint v${VERSION}"
          asset_name="markdown-mint-${VERSION}.vsix"
          notes_file="release-payload/release-notes.md"
          tag_json="$RUNNER_TEMP/release-tag.json"
          release_json="$RUNNER_TEMP/github-release.json"

          api_get() {
            local endpoint="$1"
            local response_file="$2"
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/${endpoint}"
          }

          verify_tag_target() {
            local tag_status object_type object_sha target_sha tag_object_json
            tag_status="$(api_get "git/ref/tags/${tag}" "$tag_json")"
            if [[ "$tag_status" != "200" ]]; then
              if [[ "$tag_status" == "404" ]]; then
                return 1
              fi
              cat "$tag_json"
              echo "::error::Could not inspect Git tag ${tag} (HTTP ${tag_status})."
              exit 1
            fi

            object_type="$(jq -r '.object.type' "$tag_json")"
            object_sha="$(jq -r '.object.sha' "$tag_json")"
            case "$object_type" in
              commit)
                target_sha="$object_sha"
                ;;
              tag)
                tag_object_json="$RUNNER_TEMP/annotated-tag.json"
                tag_status="$(api_get "git/tags/${object_sha}" "$tag_object_json")"
                if [[ "$tag_status" != "200" ]]; then
                  cat "$tag_object_json"
                  echo "::error::Could not resolve annotated Git tag ${tag} (HTTP ${tag_status})."
                  exit 1
                fi
                if [[ "$(jq -r '.object.type' "$tag_object_json")" != "commit" ]]; then
                  echo "::error::Git tag ${tag} does not point directly to a commit."
                  exit 1
                fi
                target_sha="$(jq -r '.object.sha' "$tag_object_json")"
                ;;
              *)
                echo "::error::Git tag ${tag} points to an unsupported object type: ${object_type}."
                exit 1
                ;;
            esac

            if [[ "$target_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Git tag ${tag} points to ${target_sha}, not this release commit ${GITHUB_SHA}."
              exit 1
            fi
            return 0
          }

          tag_exists=false
          if verify_tag_target; then
            tag_exists=true
          fi

          release_status="$(api_get "releases/tags/${tag}" "$release_json")"
          case "$release_status" in
            200)
              if [[ "$tag_exists" != true ]]; then
                echo "::error::GitHub Release ${tag} exists without its expected Git tag."
                exit 1
              fi
              ;;
            404)
              create_args=(release create "$tag" "$VSIX_PATH" --draft --title "$title" --notes-file "$notes_file" --repo "$GITHUB_REPOSITORY")
              if [[ "$tag_exists" == true ]]; then
                create_args+=(--verify-tag)
              else
                create_args+=(--target "$GITHUB_SHA")
              fi
              if ! gh "${create_args[@]}"; then
                echo "::error::Marketplace publication succeeded, but draft GitHub Release creation or asset upload failed for ${tag}. Rerun failed jobs for run ${GITHUB_RUN_ID}; the Marketplace job will not run again and payload ${ARTIFACT_NAME} remains available."
                exit 1
              fi
              release_status="$(api_get "releases/tags/${tag}" "$release_json")"
              if [[ "$release_status" != "200" ]]; then
                cat "$release_json"
                echo "::error::The draft GitHub Release ${tag} could not be read after creation (HTTP ${release_status}). Rerun failed jobs for run ${GITHUB_RUN_ID} to recover without republishing to the Marketplace."
                exit 1
              fi
              ;;
            *)
              cat "$release_json"
              echo "::error::Could not inspect GitHub Release ${tag} (HTTP ${release_status})."
              exit 1
              ;;
          esac

          release_id="$(jq -r '.id' "$release_json")"
          is_draft="$(jq -r '.draft' "$release_json")"
          if [[ "$(jq -r '.name // ""' "$release_json")" != "$title" ]]; then
            echo "::error::Existing GitHub Release ${tag} has an unexpected title; refusing to change it."
            exit 1
          fi
          existing_notes="$(jq -r '.body // ""' "$release_json")"
          expected_notes="$(cat "$notes_file")"
          if [[ "$existing_notes" != "$expected_notes" ]]; then
            echo "::error::Existing GitHub Release ${tag} has unexpected release notes; refusing to change it."
            exit 1
          fi

          asset_count="$(jq --arg name "$asset_name" '[.assets[]? | select(.name == $name)] | length' "$release_json")"
          case "$asset_count" in
            0)
              if [[ "$is_draft" != true ]]; then
                echo "::error::Published GitHub Release ${tag} is missing ${asset_name}; refusing to modify it."
                exit 1
              fi
              if ! gh release upload "$tag" "$VSIX_PATH" --repo "$GITHUB_REPOSITORY"; then
                echo "::error::Marketplace publication succeeded, but uploading ${asset_name} to draft ${tag} failed. Rerun failed jobs for run ${GITHUB_RUN_ID} to recover without republishing to the Marketplace."
                exit 1
              fi
              ;;
            1)
              asset_dir="$RUNNER_TEMP/existing-release-assets"
              mkdir -p "$asset_dir"
              if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset_name" --dir "$asset_dir"; then
                echo "::error::Could not download the existing ${asset_name} from GitHub Release ${tag}."
                exit 1
              fi
              existing_sha256="$(sha256sum "$asset_dir/$asset_name" | cut -d ' ' -f 1)"
              if [[ "$existing_sha256" != "$EXPECTED_SHA256" ]]; then
                echo "::error::Existing ${asset_name} on GitHub Release ${tag} does not match the validated VSIX checksum."
                exit 1
              fi
              ;;
            *)
              echo "::error::GitHub Release ${tag} has multiple assets named ${asset_name}."
              exit 1
              ;;
          esac

          # Re-read and verify the uploaded asset before making a draft public.
          release_status="$(api_get "releases/${release_id}" "$release_json")"
          if [[ "$release_status" != "200" ]]; then
            cat "$release_json"
            echo "::error::Could not re-read GitHub Release ${tag} before publication (HTTP ${release_status})."
            exit 1
          fi
          if [[ "$(jq -r '.draft' "$release_json")" == true ]]; then
            asset_dir="$RUNNER_TEMP/verified-release-assets"
            mkdir -p "$asset_dir"
            if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset_name" --dir "$asset_dir"; then
              echo "::error::Could not verify the VSIX asset attached to draft GitHub Release ${tag}."
              exit 1
            fi
            attached_sha256="$(sha256sum "$asset_dir/$asset_name" | cut -d ' ' -f 1)"
            if [[ "$attached_sha256" != "$EXPECTED_SHA256" ]]; then
              echo "::error::The VSIX attached to GitHub Release ${tag} does not match the validated artifact."
              exit 1
            fi
            if ! gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --field draft=false > /dev/null; then
              echo "::error::Marketplace publication succeeded and the verified VSIX is attached to draft ${tag}, but publishing that release failed. Rerun failed jobs for run ${GITHUB_RUN_ID} to recover without republishing to the Marketplace."
              exit 1
            fi
          fi

          release_status="$(api_get "releases/${release_id}" "$release_json")"
          if [[ "$release_status" != "200" || "$(jq -r '.draft' "$release_json")" != false ]]; then
            cat "$release_json"
            echo "::error::GitHub Release ${tag} is not confirmed as published. Rerun failed jobs for run ${GITHUB_RUN_ID} to recover without republishing to the Marketplace."
            exit 1
          fi

          release_url="$(jq -r '.html_url' "$release_json")"
          echo "::notice::Published ${title} from ${GITHUB_SHA}: ${release_url} (VSIX SHA-256 ${EXPECTED_SHA256})"
