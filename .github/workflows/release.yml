name: Release

# PR CI repeats the quality and package checks as separate jobs and adds browser
# and Extension Host smoke coverage. Release keeps its main-only VSIX and publish flow.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markdown-mint-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release target
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases can only be started from main (selected ref: $GITHUB_REF)."
            exit 1
          fi
          echo "Release target is main."

  validate:
    name: Validate release
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check required release tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in gh jq curl sha256sum; do
            if ! command -v "$tool"; then
              echo "::error::Required command '$tool' is missing from the ubuntu-24.04 runner image."
              exit 1
            fi
          done

      - name: Check out the selected main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release target and metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases can only be started from main (selected ref: $GITHUB_REF)."
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::Checkout does not match the workflow's selected commit $GITHUB_SHA."
            exit 1
          fi

          version="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; process.stdout.write(JSON.parse(readFileSync("package.json", "utf8")).version)')"
          tag="v${version}"
          node scripts/release-notes.mjs > "$RUNNER_TEMP/release-notes.md"

          api_status() {
            local endpoint="$1"
            local response_file="$2"
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/${endpoint}"
          }

          tag_status="$(api_status "git/ref/tags/${tag}" "$RUNNER_TEMP/tag-response.json")"
          case "$tag_status" in
            200)
              echo "::error::Git tag ${tag} already exists."
              exit 1
              ;;
            404) ;;
            *)
              cat "$RUNNER_TEMP/tag-response.json"
              echo "::error::Could not verify whether Git tag ${tag} exists (HTTP ${tag_status})."
              exit 1
              ;;
          esac

          jq -n --arg repository "$GITHUB_REPOSITORY" --arg tag "$tag" \
            '{repository: $repository, tag: $tag}' > "$RUNNER_TEMP/release-lookup.json"
          node scripts/release-recovery.mjs lookup-release \
            < "$RUNNER_TEMP/release-lookup.json" > "$RUNNER_TEMP/release-response.json"
          if [[ "$(jq -r 'if . == null then "missing" else "exists" end' "$RUNNER_TEMP/release-response.json")" == "exists" ]]; then
            echo "::error::GitHub Release or draft ${tag} already exists."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  publish_github_release:
    name: Publish GitHub Release
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check required release tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in gh jq curl sha256sum; do
            if ! command -v "$tool"; then
              echo "::error::Required command '$tool' is missing from the ubuntu-24.04 runner image."
              exit 1
            fi
          done

      - name: Check out the release commit for recovery planning
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare reproducible release metadata
        id: build_metadata
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::Publication must use the selected main commit."
            exit 1
          fi
          actual_version="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; process.stdout.write(JSON.parse(readFileSync("package.json", "utf8")).version)')"
          if [[ "$actual_version" != "$VERSION" ]]; then
            echo "::error::The package version does not match the validated release."
            exit 1
          fi
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          node scripts/release-notes.mjs > "$RUNNER_TEMP/release-notes.md"

      - name: Install dependencies
        run: npm ci

      - name: Package and verify the single VSIX
        env:
          SOURCE_DATE_EPOCH: ${{ steps.build_metadata.outputs.epoch }}
        run: npm run package

      - name: Confirm the single release VSIX and SHA-256
        id: payload
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(markdown-mint-*.vsix)
          expected="markdown-mint-${VERSION}.vsix"
          if [[ ${#packages[@]} -ne 1 || "${packages[0]}" != "$expected" ]]; then
            printf '::error::Expected exactly %s; found: %s\n' "$expected" "${packages[*]:-none}"
            exit 1
          fi
          sha256="$(sha256sum "$expected" | cut -d ' ' -f 1)"
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"
          printf 'vsix_path=%s\n' "$expected" >> "$GITHUB_OUTPUT"
          printf 'Verified release VSIX: %s (SHA-256 %s)\n' "$expected" "$sha256"

      - name: Create or recover the GitHub Release with the same VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_SHA256: ${{ steps.payload.outputs.sha256 }}
          VSIX_PATH: ${{ steps.payload.outputs.vsix_path }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          title="Markdown Mint v${VERSION}"
          asset_name="markdown-mint-${VERSION}.vsix"
          notes_file="$RUNNER_TEMP/release-notes.md"
          tag_json="$RUNNER_TEMP/release-tag.json"
          annotated_tag_json="$RUNNER_TEMP/annotated-tag.json"
          state_json="$RUNNER_TEMP/release-recovery-state.json"
          plan_json="$RUNNER_TEMP/release-recovery-plan.json"

          api_get() {
            local endpoint="$1"
            local response_file="$2"
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/${endpoint}"
          }

          load_tag_target() {
            local tag_status object_type object_sha annotated_status
            tag_target_commit_sha=""
            tag_status="$(api_get "git/ref/tags/${tag}" "$tag_json")"
            case "$tag_status" in
              200)
                object_type="$(jq -r '.object.type' "$tag_json")"
                object_sha="$(jq -r '.object.sha' "$tag_json")"
                case "$object_type" in
                  commit)
                    tag_target_commit_sha="$object_sha"
                    ;;
                  tag)
                    annotated_status="$(api_get "git/tags/${object_sha}" "$annotated_tag_json")"
                    if [[ "$annotated_status" != "200" ]]; then
                      cat "$annotated_tag_json"
                      echo "::error::Could not resolve annotated Git tag ${tag} (HTTP ${annotated_status})."
                      exit 1
                    fi
                    if [[ "$(jq -r '.object.type' "$annotated_tag_json")" != "commit" ]]; then
                      echo "::error::Git tag ${tag} does not point directly to a commit."
                      exit 1
                    fi
                    tag_target_commit_sha="$(jq -r '.object.sha' "$annotated_tag_json")"
                    ;;
                  *)
                    echo "::error::Git tag ${tag} points to an unsupported object type: ${object_type}."
                    exit 1
                    ;;
                esac
                ;;
              404) ;;
              *)
                cat "$tag_json"
                echo "::error::Could not inspect Git tag ${tag} (HTTP ${tag_status})."
                exit 1
                ;;
            esac
          }

          make_recovery_plan() {
            jq -n \
              --arg version "$VERSION" \
              --arg tag "$tag" \
              --arg targetCommitSha "$GITHUB_SHA" \
              --arg tagTargetCommitSha "$tag_target_commit_sha" \
              --arg assetName "$asset_name" \
              --arg expectedSha256 "$EXPECTED_SHA256" \
              --arg actualAssetSha256 "${actual_asset_sha256:-}" \
              --rawfile releaseNotes "$notes_file" \
              '{
                version: $version,
                tag: $tag,
                targetCommitSha: $targetCommitSha,
                tagTargetCommitSha: (if $tagTargetCommitSha == "" then null else $tagTargetCommitSha end),
                assetName: $assetName,
                expectedSha256: $expectedSha256,
                actualAssetSha256: (if $actualAssetSha256 == "" then null else $actualAssetSha256 end),
                releaseNotes: $releaseNotes
              }' > "$state_json"
            if ! node scripts/release-recovery.mjs plan-current < "$state_json" > "$plan_json"; then
              return 1
            fi
            local action
            if ! action="$(jq -er '.plan.action // empty' "$plan_json")" || [[ -z "$action" ]]; then
              return 1
            fi
            printf '%s\n' "$action"
          }

          actual_asset_sha256=""
          for attempt in 1 2 3 4 5 6 7 8; do
            load_tag_target
            if ! action="$(make_recovery_plan)"; then
              echo "::error::Could not plan GitHub Release recovery for ${tag}."
              exit 1
            fi
            case "$action" in
              create_release)
                create_args=(release create "$tag" "$VSIX_PATH" --draft --title "$title" --notes-file "$notes_file" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA")
                if [[ "$(jq -r '.plan.verifyTag' "$plan_json")" == true ]]; then
                  create_args+=(--verify-tag)
                fi
                if ! gh "${create_args[@]}"; then
                  echo "::error::Draft GitHub Release creation or asset upload failed for ${tag}. Rerun failed jobs for run ${GITHUB_RUN_ID}; the selected commit will be repackaged with the same SOURCE_DATE_EPOCH, and existing assets must match its SHA-256."
                  exit 1
                fi
                ;;
              upload_asset)
                if ! gh release upload "$tag" "$VSIX_PATH" --repo "$GITHUB_REPOSITORY"; then
                  echo "::error::Uploading ${asset_name} to draft ${tag} failed. Rerun failed jobs for run ${GITHUB_RUN_ID}; the selected commit will be repackaged with the same SOURCE_DATE_EPOCH, and existing assets must match its SHA-256."
                  exit 1
                fi
                ;;
              delete_starter_asset)
                release_id="$(jq -r '.plan.releaseId' "$plan_json")"
                asset_id="$(jq -r '.plan.assetId' "$plan_json")"
                if ! gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > /dev/null; then
                  echo "::error::Could not remove the empty starter asset ${asset_id} from draft ${tag}. Inspect this draft manually before retrying."
                  exit 1
                fi
                ;;
              verify_asset)
                release_id="$(jq -r '.plan.releaseId' "$plan_json")"
                asset_dir="$RUNNER_TEMP/release-asset-${attempt}"
                mkdir -p "$asset_dir"
                if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset_name" --dir "$asset_dir"; then
                  echo "::error::Could not download ${asset_name} from GitHub Release ${tag}."
                  exit 1
                fi
                actual_asset_sha256="$(sha256sum "$asset_dir/$asset_name" | cut -d ' ' -f 1)"
                ;;
              publish_release)
                release_id="$(jq -r '.plan.releaseId' "$plan_json")"
                if ! gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --field draft=false > /dev/null; then
                  echo "::error::The expected VSIX is attached to draft ${tag}, but publishing the GitHub Release failed. Rerun failed jobs for run ${GITHUB_RUN_ID}; the selected commit will be repackaged with the same SOURCE_DATE_EPOCH, and existing assets must match its SHA-256."
                  exit 1
                fi
                ;;
              already_published)
                release_url="$(jq -r '.release.html_url' "$plan_json")"
                echo "::notice::Published ${title} from ${GITHUB_SHA}: ${release_url} (VSIX SHA-256 ${EXPECTED_SHA256})"
                exit 0
                ;;
              *)
                echo "::error::Unknown GitHub Release recovery action: ${action}."
                exit 1
                ;;
            esac
          done

          echo "::error::GitHub Release ${tag} did not reach a completed state after recovery attempts. Rerun failed jobs for run ${GITHUB_RUN_ID}; the selected commit will be repackaged with the same SOURCE_DATE_EPOCH, and existing assets must match its SHA-256."
          exit 1
